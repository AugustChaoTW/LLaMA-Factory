### model
model_name_or_path: openai/gpt-oss-120b
adapter_name_or_path: saves/gpt-120b-ikala_tmmluplus/lora/sft
trust_remote_code: true

### method
stage: sft
finetuning_type: lora

### dataset
template: gpt
cutoff_len: 8192

### inference
infer_backend: huggingface  # use the standard HF backend for compatibility

### generation
do_sample: true
temperature: 0.6
top_p: 0.9
top_k: 50
repetition_penalty: 1.1
max_new_tokens: 2048
num_beams: 1
